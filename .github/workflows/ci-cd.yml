name: Azure ML CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyyaml
      - run: python -m compileall src
      - run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in pathlib.Path('aml').glob('*.yml'):
              yaml.safe_load(path.read_text())
          print('AML YAML validated')
          PY
        shell: bash

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure ML CLI extension
        run: az extension add --name ml --yes
      - name: Submit AML training job
        run: az ml job create --file aml/job.yml --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_ML_WORKSPACE" --set inputs.training_data.path="azureml:tickets:1"
      - name: Deploy managed endpoint
        run: az ml online-endpoint create --file aml/endpoint.yml --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_ML_WORKSPACE" || az ml online-endpoint update --file aml/endpoint.yml --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_ML_WORKSPACE"
      - name: Apply endpoint deployment
        run: az ml online-deployment create --file aml/deployment.yml --all-traffic --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_ML_WORKSPACE"
